# ==============================================================================
# ArgoCD Child Application: CloudNativePG Database Operator
# ==============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: cloudnative-pg-operator
    app.kubernetes.io/component: database-operator
spec:
  project: default
  source:
    repoURL: https://github.com/Ri4ards2006/full-stack-cluster.git
    targetRevision: main
    path: manifests/base/database
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
