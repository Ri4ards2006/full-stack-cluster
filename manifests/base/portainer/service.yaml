apiVersion: v1
kind: Service
metadata:
  name: portainer
  namespace: portainer
  labels:
    app: portainer
    app.kubernetes.io/name: portainer
spec:
  type: ClusterIP
  ports:
    - port: 9443
      targetPort: 9443
      name: https
      protocol: TCP
    - port: 9000
      targetPort: 9000
      name: http
      protocol: TCP
  selector:
    app: portainer
