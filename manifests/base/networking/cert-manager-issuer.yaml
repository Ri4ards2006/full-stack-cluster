# ==============================================================================
# cert-manager ClusterIssuer Configurations for Homelab TLS
# ==============================================================================

# 1. Self-Signed Local CA Issuer (For internal .homelab.local domain resolution)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca-issuer
spec:
  selfSigned: {}
---
# 2. Production Let's Encrypt ACME Issuer (For Public Domain Routing via Cloudflare DNS-01)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@homelab.local
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
