# ==============================================================================
# Zero-Trust Database Network Policy (Egress & Ingress Isolation)
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-db
  namespace: ticket-system
  labels:
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      app: ticket-db
  policyTypes:
    - Ingress
  ingress:
    # Allow incoming connections to PostgreSQL strictly from ticket-backend pods
    - from:
        - podSelector:
            matchLabels:
              app: ticket-backend
      ports:
        - protocol: TCP
          port: 5432

