apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-frontend
  namespace: ticket-system
  labels:
    app: ticket-frontend
    app.kubernetes.io/name: ticket-frontend
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-frontend
  template:
    metadata:
      labels:
        app: ticket-frontend
        app.kubernetes.io/name: ticket-frontend
        app.kubernetes.io/component: ui
    spec:
      containers:
      - name: web-server
        image: ghcr.io/ri4ards2006/ticket-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 10
          timeoutSeconds: 3
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 3
          timeoutSeconds: 2
          periodSeconds: 5

