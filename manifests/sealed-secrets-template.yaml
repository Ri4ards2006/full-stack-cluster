# ==============================================================================
# Bitnami SealedSecrets CRD Template
# ==============================================================================
# Instructions for GitOps Production Workflow:
# 1. Install the SealedSecrets controller on K3s:
#    kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.26.0/controller.yaml
# 2. Fetch the public sealing key:
#    kubeseal --fetch-cert --controller-name=sealed-secrets-controller --controller-namespace=kube-system > pub-sealed-secrets.pem
# 3. Encrypt your plain secret:
#    kubeseal --format=yaml --cert=pub-sealed-secrets.pem < secrets.yaml > sealed-secrets.yaml
# 4. Safely commit sealed-secrets.yaml to Git!
# ==============================================================================

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ticket-db-secrets
  namespace: ticket-system
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
spec:
  encryptedData:
    POSTGRES_USER: AgBy...EXAMPLE_ENCRYPTED_DATA...
    POSTGRES_PASSWORD: AgBz...EXAMPLE_ENCRYPTED_DATA...
    POSTGRES_DB: AgBx...EXAMPLE_ENCRYPTED_DATA...
    DATABASE_URL: AgBw...EXAMPLE_ENCRYPTED_DATA...
  template:
    metadata:
      name: ticket-db-secrets
      namespace: ticket-system
    type: Opaque
