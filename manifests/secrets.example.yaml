# ==============================================================================
# Declarative Kubernetes Secret Template (Example)
# NOTE: DO NOT COMMIT REAL CREDENTIALS TO GIT.
# Copy this file to 'secrets.yaml' (which is gitignored) and apply via:
#   kubectl apply -f secrets.yaml
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: ticket-db-secrets
  namespace: ticket-system
  labels:
    app.kubernetes.io/name: ticket-system
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_TO_A_SECURE_PASSWORD"
  POSTGRES_DB: "ticket_db"
  DATABASE_URL: "postgresql://postgres:CHANGE_ME_TO_A_SECURE_PASSWORD@ticket-db:5432/ticket_db"

