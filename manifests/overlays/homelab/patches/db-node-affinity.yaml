# ==============================================================================
# Homelab Hardware Patch: Pin PostgreSQL to Desktop NVMe Storage
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-db
  namespace: ticket-system
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - richard-desktopp

