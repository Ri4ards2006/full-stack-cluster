# ==============================================================================
# Homelab Replicas & PodAntiAffinity Patches for High Availability
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-backend
  namespace: ticket-system
spec:
  replicas: 2
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - ticket-backend
                topologyKey: kubernetes.io/hostname
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-frontend
  namespace: ticket-system
spec:
  replicas: 2
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - ticket-frontend
                topologyKey: kubernetes.io/hostname
