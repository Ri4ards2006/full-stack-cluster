# ==============================================================================
# Role: k3s_server - Tasks
# Deploys K3s Control Plane Server with declarative configuration.
# ==============================================================================

- name: Deploy declarative K3s server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: '0644'

- name: Download and execute K3s installation script
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -
  args:
    creates: /usr/local/bin/k3s

- name: Ensure k3s service is enabled and active
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for Kubernetes API Server to be ready
  ansible.builtin.wait_for:
    port: 6443
    delay: 5
    timeout: 60
