apiVersion: v1
kind: Namespace
metadata:
  name: ticket-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ticket-frontend-nginx-config
  namespace: ticket-system
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://ticket-backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ticket-frontend-html-config
  namespace: ticket-system
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TicketSystem Dashboard</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
                --panel-bg: rgba(30, 41, 59, 0.4);
                --panel-border: rgba(255, 255, 255, 0.08);
                --text-primary: #f8fafc;
                --text-secondary: #94a3b8;
                --accent: #6366f1;
                --accent-glow: rgba(99, 102, 241, 0.4);
                --success: #10b981;
                --warning: #f59e0b;
                --danger: #ef4444;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: 'Inter', sans-serif;
                background: var(--bg-gradient);
                color: var(--text-primary);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 2rem;
                overflow-x: hidden;
            }

            header {
                width: 100%;
                max-width: 1100px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 2.5rem;
                padding: 1.5rem;
                background: var(--panel-bg);
                border: 1px solid var(--panel-border);
                border-radius: 16px;
                backdrop-filter: blur(12px);
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            }

            .logo-group {
                display: flex;
                align-items: center;
                gap: 0.75rem;
            }

            .logo-icon {
                width: 36px;
                height: 36px;
                background: linear-gradient(135deg, #818cf8, #6366f1);
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                font-size: 1.25rem;
                box-shadow: 0 0 15px var(--accent-glow);
            }

            h1 {
                font-size: 1.5rem;
                font-weight: 700;
                letter-spacing: -0.025em;
                background: linear-gradient(to right, #f8fafc, #cbd5e1);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .system-status {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-size: 0.875rem;
                font-weight: 500;
                background: rgba(15, 23, 42, 0.6);
                padding: 0.5rem 1rem;
                border-radius: 9999px;
                border: 1px solid var(--panel-border);
            }

            .status-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background-color: var(--warning);
                box-shadow: 0 0 8px var(--warning);
                position: relative;
            }

            .status-dot.online {
                background-color: var(--success);
                box-shadow: 0 0 8px var(--success);
                animation: pulse 2s infinite;
            }

            .status-dot.offline {
                background-color: var(--danger);
                box-shadow: 0 0 8px var(--danger);
            }

            @keyframes pulse {
                0% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.2); opacity: 0.7; }
                100% { transform: scale(1); opacity: 1; }
            }

            main {
                width: 100%;
                max-width: 1100px;
                display: grid;
                grid-template-columns: 1fr 2fr;
                gap: 2rem;
            }

            @media (max-width: 768px) {
                main {
                    grid-template-columns: 1fr;
                }
            }

            .panel {
                background: var(--panel-bg);
                border: 1px solid var(--panel-border);
                border-radius: 16px;
                backdrop-filter: blur(12px);
                padding: 1.75rem;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.24);
            }

            h2 {
                font-size: 1.2rem;
                font-weight: 600;
                margin-bottom: 1.5rem;
                color: #e2e8f0;
                border-bottom: 1px solid var(--panel-border);
                padding-bottom: 0.75rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .form-group {
                margin-bottom: 1.25rem;
            }

            label {
                display: block;
                font-size: 0.825rem;
                color: var(--text-secondary);
                margin-bottom: 0.5rem;
                font-weight: 500;
            }

            input[type="text"], select {
                width: 100%;
                padding: 0.75rem 1rem;
                background: rgba(15, 23, 42, 0.8);
                border: 1px solid var(--panel-border);
                border-radius: 8px;
                color: var(--text-primary);
                font-family: inherit;
                font-size: 0.9rem;
                outline: none;
                transition: all 0.2s ease;
            }

            input[type="text"]:focus, select:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-glow);
            }

            button {
                width: 100%;
                padding: 0.75rem;
                background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
                border: none;
                border-radius: 8px;
                color: white;
                font-weight: 600;
                font-size: 0.95rem;
                cursor: pointer;
                transition: all 0.2s ease;
                box-shadow: 0 4px 12px var(--accent-glow);
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 0.5rem;
            }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 16px rgba(99, 102, 241, 0.6);
            }

            button:active {
                transform: translateY(0);
            }

            .ticket-list {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                max-height: 500px;
                overflow-y: auto;
                padding-right: 0.25rem;
            }

            .ticket-list::-webkit-scrollbar {
                width: 6px;
            }
            .ticket-list::-webkit-scrollbar-track {
                background: transparent;
            }
            .ticket-list::-webkit-scrollbar-thumb {
                background: var(--panel-border);
                border-radius: 3px;
            }

            .ticket-card {
                background: rgba(15, 23, 42, 0.4);
                border: 1px solid var(--panel-border);
                border-radius: 12px;
                padding: 1rem 1.25rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                transition: all 0.2s ease;
            }

            .ticket-card:hover {
                border-color: rgba(255, 255, 255, 0.2);
                transform: scale(1.01);
                background: rgba(15, 23, 42, 0.6);
            }

            .ticket-info {
                display: flex;
                flex-direction: column;
                gap: 0.35rem;
            }

            .ticket-title {
                font-weight: 500;
                color: #f1f5f9;
            }

            .ticket-meta {
                display: flex;
                gap: 0.75rem;
                align-items: center;
            }

            .badge {
                font-size: 0.7rem;
                font-weight: 600;
                text-transform: uppercase;
                padding: 0.2rem 0.5rem;
                border-radius: 4px;
                letter-spacing: 0.05em;
            }

            .badge-priority-high { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
            .badge-priority-medium { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
            .badge-priority-low { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }

            .badge-status-open { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
            .badge-status-in_progress { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
            .badge-status-closed { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

            .ticket-id {
                font-family: monospace;
                color: var(--text-secondary);
                font-size: 0.8rem;
            }

            .empty-state {
                text-align: center;
                padding: 3rem 1rem;
                color: var(--text-secondary);
                font-size: 0.95rem;
            }

            .toast {
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: #1e293b;
                border: 1px solid var(--success);
                padding: 1rem;
                border-radius: 8px;
                color: var(--text-primary);
                box-shadow: 0 10px 25px rgba(0,0,0,0.5);
                transform: translateY(150%);
                transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
                z-index: 1000;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
            .toast.show {
                transform: translateY(0);
            }
        </style>
    </head>
    <body>
        <header>
            <div class="logo-group">
                <div class="logo-icon">T</div>
                <div>
                    <h1>TicketSystem Terminal</h1>
                    <p style="font-size: 0.75rem; color: var(--text-secondary)">K3s Multi-Node Deployment Demo</p>
                </div>
            </div>
            <div class="system-status">
                <span class="status-dot" id="health-dot"></span>
                <span id="health-text">Checking Cluster...</span>
            </div>
        </header>

        <main>
            <!-- Left: Form -->
            <section class="panel">
                <h2>Create New Ticket</h2>
                <form id="ticket-form">
                    <div class="form-group">
                        <label for="ticket-title">Ticket Title</label>
                        <input type="text" id="ticket-title" required placeholder="Describe the system issue...">
                    </div>
                    <div class="form-group">
                        <label for="ticket-priority">Priority Level</label>
                        <select id="ticket-priority">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <button type="submit" id="submit-btn">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
                        Submit to Cluster DB
                    </button>
                </form>
            </section>

            <!-- Right: List -->
            <section class="panel">
                <h2>
                    Active Incidents
                    <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-secondary)" id="ticket-count">0 tickets</span>
                </h2>
                <div class="ticket-list" id="ticket-container">
                    <div class="empty-state">Loading tickets from database...</div>
                </div>
            </section>
        </main>

        <div class="toast" id="toast">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
            <span id="toast-msg">Success! Ticket created.</span>
        </div>

        <script>
            const healthDot = document.getElementById('health-dot');
            const healthText = document.getElementById('health-text');
            const ticketContainer = document.getElementById('ticket-container');
            const ticketCount = document.getElementById('ticket-count');
            const ticketForm = document.getElementById('ticket-form');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');

            function showToast(message, isSuccess = true) {
                toastMsg.innerText = message;
                toast.style.borderColor = isSuccess ? 'var(--success)' : 'var(--danger)';
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            async function checkHealth() {
                try {
                    const res = await fetch('/api/health');
                    const data = await res.json();
                    if (res.ok && data.status === 'healthy') {
                        healthDot.className = 'status-dot online';
                        healthText.innerText = 'Cluster DB: Online';
                    } else {
                        healthDot.className = 'status-dot offline';
                        healthText.innerText = 'Cluster DB: Unhealthy';
                    }
                } catch (err) {
                    healthDot.className = 'status-dot offline';
                    healthText.innerText = 'Cluster: Connection Failed';
                }
            }

            async function fetchTickets() {
                try {
                    const res = await fetch('/api/tickets');
                    if (!res.ok) throw new Error('Failed to load tickets');
                    const tickets = await res.json();
                    
                    ticketCount.innerText = `${tickets.length} ticket${tickets.length !== 1 ? 's' : ''}`;
                    
                    if (tickets.length === 0) {
                        ticketContainer.innerHTML = '<div class="empty-state">No active incidents found. Database is clean!</div>';
                        return;
                    }

                    ticketContainer.innerHTML = tickets.map(ticket => `
                        <div class="ticket-card">
                            <div class="ticket-info">
                                <span class="ticket-title">${escapeHTML(ticket.title)}</span>
                                <div class="ticket-meta">
                                    <span class="ticket-id">#${ticket.id}</span>
                                    <span class="badge badge-priority-${ticket.priority.toLowerCase()}">${ticket.priority}</span>
                                    <span class="badge badge-status-${ticket.status.toLowerCase().replace(' ', '_')}">${ticket.status}</span>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } catch (err) {
                    ticketContainer.innerHTML = `<div class="empty-state" style="color:var(--danger)">Error loading tickets: ${err.message}</div>`;
                }
            }

            function escapeHTML(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
                );
            }

            ticketForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const titleInput = document.getElementById('ticket-title');
                const priorityInput = document.getElementById('ticket-priority');
                const title = titleInput.value.trim();
                const priority = priorityInput.value;

                if (!title) return;

                try {
                    const res = await fetch('/api/tickets', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, priority })
                    });

                    if (res.ok) {
                        showToast('Ticket submitted to cluster database!');
                        titleInput.value = '';
                        fetchTickets();
                        checkHealth();
                    } else {
                        const errData = await res.json();
                        throw new Error(errData.error || 'Server error');
                    }
                } catch (err) {
                    showToast(`Submission failed: ${err.message}`, false);
                }
            });

            // Initial setup
            checkHealth();
            fetchTickets();

            // Poll health every 10 seconds
            setInterval(checkHealth, 10000);
        </script>
    </body>
    </html>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ticket-db-pvc
  namespace: ticket-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-db
  namespace: ticket-system
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: ticket-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-db
  namespace: ticket-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ticket-db
  template:
    metadata:
      labels:
        app: ticket-db
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - richard-desktopp
      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: SuperSecretDbPassw0rd
        - name: POSTGRES_DB
          value: ticket_db
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - ticket_db
          initialDelaySeconds: 15
          timeoutSeconds: 5
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - ticket_db
          initialDelaySeconds: 5
          timeoutSeconds: 5
          periodSeconds: 5
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: ticket-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-backend
  namespace: ticket-system
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: ticket-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-backend
  namespace: ticket-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-backend
  template:
    metadata:
      labels:
        app: ticket-backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ticket-backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: flask-api
        image: python:3.10-slim
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          pip install --no-cache-dir flask psycopg2-binary
          python -c '
          from flask import Flask, jsonify, request
          import psycopg2
          import os
          import time

          app = Flask(__name__)

          def init_db():
              db_host = os.environ.get("DB_HOST", "ticket-db")
              db_name = os.environ.get("DB_NAME", "ticket_db")
              db_user = os.environ.get("DB_USER", "postgres")
              db_pass = os.environ.get("DB_PASSWORD", "SuperSecretDbPassw0rd")
              
              for i in range(10):
                  try:
                      conn = psycopg2.connect(host=db_host, database=db_name, user=db_user, password=db_pass, connect_timeout=3)
                      cur = conn.cursor()
                      cur.execute("""
                          CREATE TABLE IF NOT EXISTS tickets (
                              id SERIAL PRIMARY KEY,
                              title VARCHAR(255) NOT NULL,
                              priority VARCHAR(50) DEFAULT '\''Low'\'',
                              status VARCHAR(50) DEFAULT '\''Open'\''
                          );
                      """)
                      cur.execute("SELECT COUNT(*) FROM tickets;")
                      if cur.fetchone()[0] == 0:
                          cur.execute("INSERT INTO tickets (title, priority, status) VALUES ('\''Database connection issue'\'', '\''High'\'', '\''Open'\'');")
                          cur.execute("INSERT INTO tickets (title, priority, status) VALUES ('\''Tailscale routing latency'\'', '\''Medium'\'', '\''In Progress'\'');")
                          cur.execute("INSERT INTO tickets (title, priority, status) VALUES ('\''Portainer RBAC setup'\'', '\''Low'\'', '\''Closed'\'');")
                      conn.commit()
                      cur.close()
                      conn.close()
                      print("Database initialized successfully.")
                      break
                  except Exception as e:
                      print(f"Database init retry {i+1}/10 failed: {e}")
                      time.sleep(3)

          @app.route("/api/health", methods=["GET"])
          def health():
              try:
                  conn = psycopg2.connect(
                      host=os.environ.get("DB_HOST", "ticket-db"),
                      database=os.environ.get("DB_NAME", "ticket_db"),
                      user=os.environ.get("DB_USER", "postgres"),
                      password=os.environ.get("DB_PASSWORD", "SuperSecretDbPassw0rd"),
                      connect_timeout=3
                  )
                  conn.close()
                  return jsonify({"status": "healthy", "database": "connected"})
              except Exception as e:
                  return jsonify({"status": "unhealthy", "database": "disconnected", "error": str(e)}), 500

          @app.route("/api/tickets", methods=["GET"])
          def get_tickets():
              try:
                  conn = psycopg2.connect(
                      host=os.environ.get("DB_HOST", "ticket-db"),
                      database=os.environ.get("DB_NAME", "ticket_db"),
                      user=os.environ.get("DB_USER", "postgres"),
                      password=os.environ.get("DB_PASSWORD", "SuperSecretDbPassw0rd")
                  )
                  cur = conn.cursor()
                  cur.execute("SELECT id, title, priority, status FROM tickets ORDER BY id DESC;")
                  rows = cur.fetchall()
                  tickets = [{"id": r[0], "title": r[1], "priority": r[2], "status": r[3]} for r in rows]
                  cur.close()
                  conn.close()
                  return jsonify(tickets)
              except Exception as e:
                  return jsonify({"error": str(e)}), 500

          @app.route("/api/tickets", methods=["POST"])
          def create_ticket():
              try:
                  data = request.get_json()
                  title = data.get("title")
                  priority = data.get("priority", "Low")
                  status = "Open"
                  if not title:
                      return jsonify({"error": "Title required"}), 400
                  conn = psycopg2.connect(
                      host=os.environ.get("DB_HOST", "ticket-db"),
                      database=os.environ.get("DB_NAME", "ticket_db"),
                      user=os.environ.get("DB_USER", "postgres"),
                      password=os.environ.get("DB_PASSWORD", "SuperSecretDbPassw0rd")
                  )
                  cur = conn.cursor()
                  cur.execute(
                      "INSERT INTO tickets (title, priority, status) VALUES (%s, %s, %s) RETURNING id;",
                      (title, priority, status)
                  )
                  ticket_id = cur.fetchone()[0]
                  conn.commit()
                  cur.close()
                  conn.close()
                  return jsonify({"id": ticket_id, "title": title, "priority": priority, "status": status}), 201
              except Exception as e:
                  return jsonify({"error": str(e)}), 500

          if __name__ == "__main__":
              init_db()
              app.run(host="0.0.0.0", port=5000)
          '
        env:
        - name: DB_HOST
          value: "ticket-db"
        - name: DB_NAME
          value: "ticket_db"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "SuperSecretDbPassw0rd"
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 20
          timeoutSeconds: 3
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-frontend
  namespace: ticket-system
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: ticket-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-frontend
  namespace: ticket-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-frontend
  template:
    metadata:
      labels:
        app: ticket-frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ticket-frontend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: web-server
        image: nginx:1.25-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 128Mi
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: html-content
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          timeoutSeconds: 3
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          timeoutSeconds: 3
          periodSeconds: 10
      volumes:
      - name: nginx-config
        configMap:
          name: ticket-frontend-nginx-config
      - name: html-content
        configMap:
          name: ticket-frontend-html-config
