<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Hub - Kubernetes Cluster</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.5);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding: 1.5rem;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.25rem;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #f8fafc, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            background: rgba(15, 23, 42, 0.6);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            border: 1px solid var(--panel-border);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--warning);
            box-shadow: 0 0 8px var(--warning);
        }

        .status-dot.online {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }

        .status-dot.offline {
            background-color: var(--danger);
            box-shadow: 0 0 8px var(--danger);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        main {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            padding: 1.75rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.24);
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #e2e8f0;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.825rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px var(--accent-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.6);
        }

        .ticket-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .ticket-list::-webkit-scrollbar {
            width: 6px;
        }
        .ticket-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .ticket-list::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 3px;
        }

        .ticket-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .ticket-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.01);
            background: rgba(15, 23, 42, 0.6);
        }

        .ticket-info {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .ticket-title {
            font-weight: 500;
            color: #f1f5f9;
        }

        .ticket-meta {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            letter-spacing: 0.05em;
        }

        .badge-priority-high { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-priority-medium { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-priority-low { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }

        .badge-status-open { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-status-in_progress { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-status-closed { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

        .ticket-id {
            font-family: monospace;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e293b;
            border: 1px solid var(--success);
            padding: 1rem;
            border-radius: 8px;
            color: var(--text-primary);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .toast.show {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-group">
            <div class="logo-icon">T</div>
            <div>
                <h1>TicketSystem Terminal</h1>
                <p style="font-size: 0.75rem; color: var(--text-secondary)">K3s Multi-Node Deployment Showcase</p>
            </div>
        </div>
        <div class="system-status">
            <span class="status-dot" id="health-dot"></span>
            <span id="health-text">Checking Cluster...</span>
        </div>
    </header>

    <main>
        <!-- Form Panel -->
        <section class="panel">
            <h2>Create New Incident</h2>
            <form id="ticket-form">
                <div class="form-group">
                    <label for="ticket-title">Incident Title</label>
                    <input type="text" id="ticket-title" required placeholder="Describe the cluster or workload issue...">
                </div>
                <div class="form-group">
                    <label for="ticket-priority">Priority Level</label>
                    <select id="ticket-priority">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <button type="submit" id="submit-btn">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
                    Submit to PostgreSQL
                </button>
            </form>
        </section>

        <!-- Incidents List Panel -->
        <section class="panel">
            <h2>
                Active Cluster Incidents
                <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-secondary)" id="ticket-count">0 tickets</span>
            </h2>
            <div class="ticket-list" id="ticket-container">
                <div class="empty-state">Loading tickets from database...</div>
            </div>
        </section>
    </main>

    <div class="toast" id="toast">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-msg">Success! Ticket created.</span>
    </div>

    <script>
        const healthDot = document.getElementById('health-dot');
        const healthText = document.getElementById('health-text');
        const ticketContainer = document.getElementById('ticket-container');
        const ticketCount = document.getElementById('ticket-count');
        const ticketForm = document.getElementById('ticket-form');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');

        function showToast(message, isSuccess = true) {
            toastMsg.innerText = message;
            toast.style.borderColor = isSuccess ? 'var(--success)' : 'var(--danger)';
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        async function checkHealth() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                if (res.ok && data.status === 'healthy') {
                    healthDot.className = 'status-dot online';
                    healthText.innerText = 'Cluster DB: Online';
                } else {
                    healthDot.className = 'status-dot offline';
                    healthText.innerText = 'Cluster DB: Degraded';
                }
            } catch (err) {
                healthDot.className = 'status-dot offline';
                healthText.innerText = 'Cluster: Disconnected';
            }
        }

        async function fetchTickets() {
            try {
                const res = await fetch('/api/tickets');
                if (!res.ok) throw new Error('Failed to load tickets');
                const tickets = await res.json();
                
                ticketCount.innerText = `${tickets.length} ticket${tickets.length !== 1 ? 's' : ''}`;
                
                if (tickets.length === 0) {
                    ticketContainer.innerHTML = '<div class="empty-state">No incidents found in database. Cluster is healthy!</div>';
                    return;
                }

                ticketContainer.innerHTML = tickets.map(ticket => `
                    <div class="ticket-card">
                        <div class="ticket-info">
                            <span class="ticket-title">${escapeHTML(ticket.title)}</span>
                            <div class="ticket-meta">
                                <span class="ticket-id">#${ticket.id}</span>
                                <span class="badge badge-priority-${ticket.priority.toLowerCase()}">${escapeHTML(ticket.priority)}</span>
                                <span class="badge badge-status-${ticket.status.toLowerCase().replace(' ', '_')}">${escapeHTML(ticket.status)}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                ticketContainer.innerHTML = `<div class="empty-state" style="color:var(--danger)">Error loading tickets: ${err.message}</div>`;
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        ticketForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const titleInput = document.getElementById('ticket-title');
            const priorityInput = document.getElementById('ticket-priority');
            const title = titleInput.value.trim();
            const priority = priorityInput.value;

            if (!title) return;

            try {
                const res = await fetch('/api/tickets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, priority })
                });

                if (res.ok) {
                    showToast('Ticket committed to PostgreSQL database!');
                    titleInput.value = '';
                    fetchTickets();
                    checkHealth();
                } else {
                    const errData = await res.json();
                    throw new Error(errData.error || 'Server error');
                }
            } catch (err) {
                showToast(`Submission failed: ${err.message}`, false);
            }
        });

        // Initialize polling
        checkHealth();
        fetchTickets();
        setInterval(checkHealth, 10000);
    </script>
</body>
</html>
